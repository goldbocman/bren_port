license = "CC0-1.0"

modLoader="javafml"
loaderVersion="[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = [
    "goldbocman"
]
description = "Vanilla-like Minecraft guns [Bren Legacy Port]"

logoFile = "assets/vgm/icon.png"
displayURL = "https://modrinth.com/mod/vanilla-guns-mod"
issueTrackerUrl = "https://github.com/goldbocman/bren_port/issues"

[[mixins]]
config = "${mixinsConfig}"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"