name: Release

on:
  push:
    tags:
      - '26.2-*\+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^([0-9]+\.[0-9]+)-(all|fabric|neoforge)\+(.+)$ ]]; then
            echo "::error::Tag '$TAG' doesn't match <mc>-<all|fabric|neoforge>+<mod_version>, e.g. 26.2-all+0.1.0"
            exit 1
          fi
          MC_VERSION="${BASH_REMATCH[1]}"
          OPTION="${BASH_REMATCH[2]}"
          MOD_VERSION="${BASH_REMATCH[3]}"

          if [[ "$MC_VERSION" != "26.2" ]]; then
            echo "::error::Only MC 26.2 is available for publishing right now (got '$MC_VERSION')."
            exit 1
          fi

          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "option=$OPTION" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify mod.version matches stonecutter.properties.toml
        run: |
          # mod.version can be overridden per loader (e.g. [fabric."26.2.x"]), falling back
          # to the top-level default - read the value actually in effect for each loader.
          get_version() {
            local loader="$1"
            local section="[$loader.\"26.2.x\"]"
            local line
            line=$(awk -v sec="$section" '
              $0 == sec { infile=1; next }
              infile && /^\[/ { exit }
              infile && /^mod\.version[[:space:]]*=/ { print; exit }
            ' stonecutter.properties.toml)
            if [[ -z "$line" ]]; then
              line=$(awk '
                /^\[/ { exit }
                /^mod\.version[[:space:]]*=/ { print; exit }
              ' stonecutter.properties.toml)
            fi
            echo "$line" | sed -E 's/.*"(.*)".*/\1/'
          }

          OPTION="${{ steps.tag.outputs.option }}"
          TAG_VERSION="${{ steps.tag.outputs.mod_version }}"

          if [[ "$OPTION" == "all" || "$OPTION" == "fabric" ]]; then
            FABRIC_VERSION=$(get_version fabric)
            if [[ "$FABRIC_VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::Tag mod version ($TAG_VERSION) != fabric mod.version in stonecutter.properties.toml ($FABRIC_VERSION)"
              exit 1
            fi
          fi

          if [[ "$OPTION" == "all" || "$OPTION" == "neoforge" ]]; then
            NEOFORGE_VERSION=$(get_version neoforge)
            if [[ "$NEOFORGE_VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::Tag mod version ($TAG_VERSION) != neoforge mod.version in stonecutter.properties.toml ($NEOFORGE_VERSION)"
              exit 1
            fi
          fi

      - name: Extract changelog section
        run: |
          awk -v ver="## ${{ steps.tag.outputs.mc_version }} - ${{ steps.tag.outputs.mod_version }}" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "::warning::No CHANGELOG.md section found for '## ${{ steps.tag.outputs.mc_version }} - ${{ steps.tag.outputs.mod_version }}'"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric jar
        if: contains(fromJSON('["all","fabric"]'), steps.tag.outputs.option)
        run: |
          ./gradlew :stonecutterSwitchTo26.2.x-fabric
          ./gradlew :26.2.x-fabric:clean
          ./gradlew :26.2.x-fabric:build --stacktrace

      - name: Publish Fabric
        if: contains(fromJSON('["all","fabric"]'), steps.tag.outputs.option)
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: versions/26.2.x-fabric/build/libs/!(*-@(sources|dev)).jar
          name: "Vanilla Gun Mod ${{ steps.tag.outputs.mod_version }} (Fabric, MC ${{ steps.tag.outputs.mc_version }})"
          version: ${{ steps.tag.outputs.mod_version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.tag.outputs.mc_version }}
          changelog-file: release_notes.md

      - name: Build NeoForge jar
        if: contains(fromJSON('["all","neoforge"]'), steps.tag.outputs.option)
        run: |
          ./gradlew :stonecutterSwitchTo26.2.x-neoforge
          ./gradlew :26.2.x-neoforge:clean
          ./gradlew :26.2.x-neoforge:build --stacktrace

      - name: Publish NeoForge
        if: contains(fromJSON('["all","neoforge"]'), steps.tag.outputs.option)
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: versions/26.2.x-neoforge/build/libs/!(*-@(sources|dev)).jar
          name: "Vanilla Gun Mod ${{ steps.tag.outputs.mod_version }} (NeoForge, MC ${{ steps.tag.outputs.mc_version }})"
          version: ${{ steps.tag.outputs.mod_version }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ steps.tag.outputs.mc_version }}
          changelog-file: release_notes.md
