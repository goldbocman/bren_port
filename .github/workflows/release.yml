name: Release

on:
  push:
    tags:
      - '26.2-*\+*'
      - '1.21.1-*\+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^([0-9]+\.[0-9]+(\.[0-9]+)?)-(all|fabric|neoforge)\+(.+)$ ]]; then
            echo "::error::Tag '$TAG' doesn't match <mc>-<all|fabric|neoforge>+<mod_version>, e.g. 26.2-all+0.1.0"
            exit 1
          fi
          MC_VERSION="${BASH_REMATCH[1]}"
          OPTION="${BASH_REMATCH[3]}"
          MOD_VERSION="${BASH_REMATCH[4]}"

          # Maps the tag's MC version to the stonecutter project key (versions/<key>-<loader>,
          # :stonecutterSwitchTo<key>-<loader>) - not always the same string, e.g. 26.2 -> 26.2.x.
          case "$MC_VERSION" in
            26.2)
              STONECUTTER_VERSION="26.2.x"
              ;;
            1.21.1)
              STONECUTTER_VERSION="1.21.1"
              ;;
            *)
              echo "::error::Unsupported MC version '$MC_VERSION' (got from tag '$TAG'). Supported: 26.2, 1.21.1."
              exit 1
              ;;
          esac

          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "stonecutter_version=$STONECUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "option=$OPTION" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify mod.version matches stonecutter.properties.toml
        run: |
          # mod.version can be overridden per loader (e.g. [fabric."26.2.x"]), falling back
          # to the top-level default - read the value actually in effect for each loader.
          get_version() {
            local loader="$1"
            local section="[$loader.\"${{ steps.tag.outputs.stonecutter_version }}\"]"
            local line
            line=$(awk -v sec="$section" '
              $0 == sec { infile=1; next }
              infile && /^\[/ { exit }
              infile && /^mod\.version[[:space:]]*=/ { print; exit }
            ' stonecutter.properties.toml)
            if [[ -z "$line" ]]; then
              line=$(awk '
                /^\[/ { exit }
                /^mod\.version[[:space:]]*=/ { print; exit }
              ' stonecutter.properties.toml)
            fi
            echo "$line" | sed -E 's/.*"(.*)".*/\1/'
          }

          OPTION="${{ steps.tag.outputs.option }}"
          TAG_VERSION="${{ steps.tag.outputs.mod_version }}"

          if [[ "$OPTION" == "all" || "$OPTION" == "fabric" ]]; then
            FABRIC_VERSION=$(get_version fabric)
            if [[ "$FABRIC_VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::Tag mod version ($TAG_VERSION) != fabric mod.version in stonecutter.properties.toml ($FABRIC_VERSION)"
              exit 1
            fi
          fi

          if [[ "$OPTION" == "all" || "$OPTION" == "neoforge" ]]; then
            NEOFORGE_VERSION=$(get_version neoforge)
            if [[ "$NEOFORGE_VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::Tag mod version ($TAG_VERSION) != neoforge mod.version in stonecutter.properties.toml ($NEOFORGE_VERSION)"
              exit 1
            fi
          fi

      - name: Determine game versions
        id: versions
        run: |
          # mod.mc_releases is declared once per stonecutter version (shared by both loaders),
          # e.g. ["26.2"] for 26.2.x or ["1.21", "1.21.1"] for 1.21.1 - publish compat with all of them.
          get_mc_releases() {
            local section="[\"$1\"]"
            awk -v sec="$section" '
              $0 == sec { infile=1; next }
              infile && /^\[/ { exit }
              infile && /^mod\.mc_releases[[:space:]]*=/ { print; exit }
            ' stonecutter.properties.toml \
              | sed -E 's/.*\[(.*)\].*/\1/' \
              | tr ',' '\n' \
              | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//'
          }

          RELEASES=$(get_mc_releases "${{ steps.tag.outputs.stonecutter_version }}")
          if [[ -z "$RELEASES" ]]; then
            echo "::error::No mod.mc_releases found for stonecutter version '${{ steps.tag.outputs.stonecutter_version }}' in stonecutter.properties.toml"
            exit 1
          fi

          {
            echo "game_versions<<GVEOF"
            echo "$RELEASES"
            echo "GVEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          awk -v ver="## ${{ steps.tag.outputs.mc_version }} - ${{ steps.tag.outputs.mod_version }}" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "::warning::No CHANGELOG.md section found for '## ${{ steps.tag.outputs.mc_version }} - ${{ steps.tag.outputs.mod_version }}'"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric jar
        if: contains(fromJSON('["all","fabric"]'), steps.tag.outputs.option)
        run: |
          ./gradlew :stonecutterSwitchTo${{ steps.tag.outputs.stonecutter_version }}-fabric
          ./gradlew :${{ steps.tag.outputs.stonecutter_version }}-fabric:clean
          ./gradlew :${{ steps.tag.outputs.stonecutter_version }}-fabric:build --stacktrace

      - name: Publish Fabric
        if: contains(fromJSON('["all","fabric"]'), steps.tag.outputs.option)
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: versions/${{ steps.tag.outputs.stonecutter_version }}-fabric/build/libs/!(*-@(sources|dev)).jar
          name: "Vanilla Gun Mod ${{ steps.tag.outputs.mod_version }} (Fabric, MC ${{ steps.tag.outputs.mc_version }})"
          version: ${{ steps.tag.outputs.mod_version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.game_versions }}
          changelog-file: release_notes.md

      - name: Build NeoForge jar
        if: contains(fromJSON('["all","neoforge"]'), steps.tag.outputs.option)
        run: |
          ./gradlew :stonecutterSwitchTo${{ steps.tag.outputs.stonecutter_version }}-neoforge
          ./gradlew :${{ steps.tag.outputs.stonecutter_version }}-neoforge:clean
          ./gradlew :${{ steps.tag.outputs.stonecutter_version }}-neoforge:build --stacktrace

      - name: Publish NeoForge
        if: contains(fromJSON('["all","neoforge"]'), steps.tag.outputs.option)
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: versions/${{ steps.tag.outputs.stonecutter_version }}-neoforge/build/libs/!(*-@(sources|dev)).jar
          name: "Vanilla Gun Mod ${{ steps.tag.outputs.mod_version }} (NeoForge, MC ${{ steps.tag.outputs.mc_version }})"
          version: ${{ steps.tag.outputs.mod_version }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ steps.versions.outputs.game_versions }}
          changelog-file: release_notes.md
